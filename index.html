<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Илья Криканов — Head of Design</title>
<meta name="description" content="Портфолио Ильи Криканова: менеджмент, артдирекшн и продуктовый дизайн корпоративных платформ, дизайн-систем и мобильных приложений.">
<link rel="icon" href="avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F3EF;--surface:#FFFFFF;--ink:#0E0E10;--body:#3B3B40;--muted:#76767C;--line:rgba(14,14,16,.12);
  --blue:#1B35EB;--orange:#FF7A45;--paper:#FFFFFF;
  --pad:40px;--max:1360px;--ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:72px}
body{background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;font-size:17px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{width:100%;max-width:var(--max);margin:0 auto}
.sec{padding:120px var(--pad)}
.label{font-family:"Geist Mono",ui-monospace,monospace;font-weight:500;font-size:12px;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.display{font-weight:500;font-size:136px;line-height:.95;letter-spacing:-.05em}
.display-s{font-weight:500;font-size:88px;line-height:1;letter-spacing:-.045em}
.h2{font-weight:500;font-size:56px;line-height:1;letter-spacing:-.04em}
.h3{font-weight:500;font-size:32px;line-height:1.1;letter-spacing:-.03em}
.lead{font-size:24px;line-height:1.35;letter-spacing:-.02em}
.stat{font-weight:500;font-size:72px;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.body{color:var(--body)}
.balance{text-wrap:balance}.pretty{text-wrap:pretty}

/* nav */
nav{position:sticky;top:0;z-index:5;background:rgba(243,243,239,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px var(--pad)}
nav .wrap{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font-weight:500;font-size:15px}
.brand img{width:36px;height:36px;border-radius:50%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.25}}
.links{display:flex;align-items:center;gap:28px;font-weight:500;font-size:15px}
.links a.l{color:var(--muted);transition:color .2s}.links a.l:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px 10px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:500;font-size:15px;transition:background .2s}
.btn:hover{background:var(--blue)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* intro */
.intro{padding:88px var(--pad) 72px}
.intro .wrap{display:flex;flex-direction:column;gap:56px}
.row{display:flex;justify-content:space-between;align-items:center;gap:24px}
.h1 span{display:block;overflow:hidden}
.h1 span i{display:block;font-style:normal;transform:translateY(100%);filter:blur(10px);opacity:0;animation:rise 1s var(--ease) forwards}
.h1 span:nth-child(2) i{animation-delay:.08s}.h1 span:nth-child(3) i{animation-delay:.16s}
@keyframes rise{to{transform:none;filter:none;opacity:1}}
.h1 b{color:var(--blue);font-weight:500}
.intro-bottom{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-end}
.intro-bottom>*{flex:1 1 320px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.pill{border:1px solid rgba(14,14,16,.14);border-radius:999px;padding:8px 14px;color:var(--ink)}

/* ticker */
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden}
.track{display:flex;gap:40px;align-items:center;width:max-content;animation:tick 40s linear infinite}
.ticker:hover .track{animation-duration:100s}
.track span.h3{white-space:nowrap;font-size:32px}
.track i{width:10px;height:10px;border-radius:50%;background:var(--blue);flex:none}
.track i:nth-of-type(2n){background:var(--orange)}
@keyframes tick{to{transform:translateX(-50%)}}

/* projects */
.head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:32px;margin-bottom:64px}
.head .t{display:flex;gap:10px;align-items:flex-start}
.head .t .label{color:var(--blue)}
.feat{display:flex;flex-direction:column;gap:24px;margin-bottom:72px}
.cover{position:relative;aspect-ratio:2.4;border-radius:28px;overflow:hidden;background:#222}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.feat:hover .cover img{transform:scale(1.03)}
.chip{position:absolute;top:24px;left:24px;display:flex;gap:10px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.14);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.28)}
.chip .label{color:#fff}
.arrow{position:absolute;top:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink)}
.arrow .ic{width:22px;height:22px}
.meta{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:72px 24px}
.card{display:flex;flex-direction:column;gap:20px;transition:transform .4s var(--ease)}
.card:hover{transform:translateY(-6px)}
.card .img{aspect-ratio:1.4;border-radius:24px;overflow:hidden;background:#ddd}
.card .img img{width:100%;height:100%;object-fit:cover}
.card .idx{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.card .idx .label:first-child{color:var(--blue)}
.card .h3{margin-bottom:10px}

/* about */
.white{background:var(--surface)}
.split{display:flex;flex-wrap:wrap;gap:48px}
.split>.side{flex:1 1 260px;display:flex;flex-direction:column;gap:24px}
.split>.main{flex:2 1 320px;display:flex;flex-direction:column;gap:28px}
.mark{width:96px;height:96px;border-radius:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:64px}
.st{background:var(--bg);border-radius:24px;padding:28px;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.st p{color:var(--body);margin-bottom:10px}
.st.accent{background:var(--blue);color:#fff}.st.accent p{color:rgba(255,255,255,.85)}.st.accent .label{color:rgba(255,255,255,.6)}

/* expertise */
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 24px;margin-top:64px}
.area{border-top:1px solid var(--ink);padding-top:28px;display:flex;flex-direction:column;gap:20px}
.area .icb{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.area .icb .ic{width:22px;height:22px;stroke-width:1.5}

/* experience */
.job{display:flex;flex-wrap:wrap;gap:24px;padding:28px 0;border-top:1px solid var(--line);align-items:flex-start}
.job:last-child{border-bottom:1px solid var(--line)}
.job .p{width:200px}
.job .c{flex:1 1 220px}
.job .c .h3{font-size:32px;margin-bottom:6px}

/* footer */
footer{background:var(--ink);color:#fff;padding:120px var(--pad) 36px}
footer .wrap{display:flex;flex-direction:column;gap:96px}
footer .label{color:rgba(255,255,255,.5)}
.soc{display:flex;flex-wrap:wrap;gap:16px}
.soc a{display:inline-flex;align-items:center;gap:14px;padding:18px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.2);transition:background .2s}
.soc a:hover{background:rgba(255,255,255,.08)}
.soc .ic{width:24px;height:24px}
.fb{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.12);padding-top:24px}

/* case page */
.case-head{padding:56px var(--pad) 48px}
.case-head .wrap{display:flex;flex-direction:column;gap:40px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px;width:max-content;transition:transform .3s var(--ease)}
.back:hover{transform:translateX(-4px)}
.cmeta{display:flex;align-items:center;gap:16px}.cmeta .label:first-child{color:var(--blue)}.cmeta hr{width:24px;border:0;border-top:1px solid var(--line)}
.ccover{padding:0 var(--pad)}
.ccover .cover{max-width:var(--max);margin:0 auto}
.info{padding:80px var(--pad) 40px}
.info .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.info .col{border-top:1px solid var(--ink);padding-top:20px;display:flex;flex-direction:column;gap:14px}
.info .col p{color:var(--body)}
.cbody{padding:40px var(--pad) 120px}
.cbody .inner{max-width:960px;margin:0 auto}
.cbody h2{font-weight:500;font-size:36px;line-height:1.1;letter-spacing:-.035em;margin:64px 0 20px}
.cbody p{font-size:19px;line-height:1.6;letter-spacing:-.01em;color:var(--body);margin-bottom:20px}
.cbody figure{margin:32px 0}
.cbody figure img{width:100%;border-radius:20px}
.cbody .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
.cbody .pair figure{margin:0}
.next{padding:0 var(--pad) 120px}
.next a{max-width:var(--max);margin:0 auto;border-top:1px solid var(--ink);padding-top:40px;display:flex;justify-content:space-between;align-items:center;gap:24px;transition:transform .4s var(--ease)}
.next a:hover{transform:translateX(8px)}
.next .circle{width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.next .circle .ic{width:28px;height:28px}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.track{animation:none}.h1 span i{animation:none;opacity:1;transform:none;filter:none}}

/* tablet */
@media (max-width:1199.98px){
  .display{font-size:88px}.display-s{font-size:60px}.h2{font-size:44px}.h3{font-size:26px}.lead{font-size:21px}.stat{font-size:56px}
  .stats,.areas{grid-template-columns:repeat(2,1fr)}
  .cbody h2{font-size:30px}.cbody p{font-size:18px}
}
/* phone */
@media (max-width:809.98px){
  :root{--pad:16px}
  .display{font-size:52px}.display-s{font-size:40px}.h2{font-size:34px}.h3,.job .c .h3{font-size:24px}.lead{font-size:19px}.stat{font-size:48px}
  .sec{padding:80px var(--pad)}
  nav{padding:12px var(--pad)}.links a.l{display:none}.btn{padding:9px 14px 9px 16px}
  .intro{padding:40px var(--pad) 48px}.intro .wrap{gap:40px}.intro .loc{display:none}.intro-bottom{gap:28px}.tags{justify-content:flex-start}
  .track span.h3{font-size:24px}
  .head{margin-bottom:40px}.feat{margin-bottom:56px}
  .feat .cover{aspect-ratio:1.1;border-radius:20px}.chip{top:14px;left:14px}.arrow{top:14px;right:14px;width:44px;height:44px}
  .grid{grid-template-columns:1fr;gap:56px}.card .img{border-radius:20px}
  .stats{grid-template-columns:1fr;gap:12px;margin-top:40px}.st{min-height:200px;padding:24px}
  .areas{grid-template-columns:1fr;margin-top:40px}
  .job{gap:12px;padding:24px 0}.job .p{width:100%}
  footer{padding:80px var(--pad) 24px}footer .wrap{gap:56px}.soc a{padding:14px 20px}.fb{flex-direction:column}
  .case-head{padding:32px var(--pad)}.case-head .wrap{gap:28px}
  .ccover .cover{aspect-ratio:1.3;border-radius:20px}
  .info{padding:48px var(--pad) 24px}.info .wrap{grid-template-columns:1fr;gap:32px}
  .cbody{padding:24px var(--pad) 80px}.cbody h2{font-size:26px;margin-top:48px}.cbody p{font-size:17px}.cbody .pair{grid-template-columns:1fr}
  .next{padding:0 var(--pad) 80px}.next .circle{width:52px;height:52px}
}
</style>
</head>

<script>
const P = [
 { slug:"sfera", title:"Sfera", num:"01", sub:"Платформа для разработки ИТ-продуктов", tags:"Management • UX/UI • Product design • Web", type:"Enterprise-платформа", cover:"sfera_hero", prev:"sfera_hero", link:"sferaplatform.ru",
   about:"Сфера — платформа производства ИТ-продуктов. Её задача — заменить ушедшие с рынка инструменты (Jira, Confluence, Bitbucket и другие) для разработки продуктов и мониторинга эффективности систем и процессов.",
   result:"Экосистема с едиными паттернами для 40+ продуктов. Квартальный рост UMUX и SCAT около 10%. Дизайн-система закрывает 87% потребностей продуктов. Платформу внедрили Т1, ВТБ, Почта Банк, Почта России, Росгосстрах и VK Tech.",
   body:[["img","sfera_1"],["img","sfera_2"],["h2","Почему платформа"],["p","Рынок запросил импортозамещение. В крупных продуктах появилась потребность заменить большие функциональные области, чтобы сохранить сложившийся производственный подход."],["h2","Требования"],["p","Замещаемые продукты содержат много данных, а в платформу входит больше 40 продуктов. Поэтому платформа должна давать разнообразие в отображении информации, быструю и прозрачную навигацию и отсутствие проблем в основных сценариях даже при сильной нагрузке данными."],["p","На ранних этапах опирались на бенчмаркинг, позже фокус сместился на работу с данными. Мы сократили расстояния между элементами, чтобы уместить больше информации на экране, и заменили шрифт: по исследованиям около 70% пользователей уменьшают масштаб на 10–15%, и нужен был шрифт, который не теряет читабельность."],["img","sfera_3"],["h2","Дизайн"],["p","Сфера — экосистема, поэтому формировать решения только на основе конкурентов нельзя. Дизайн учитывает и анализ конкурентов, и UX/UI всей экосистемы. Для понятного перемещения между продуктами появились навигация и модули, которые позволяют делать ответвления от сценария, не разрывая его. Для быстрого обзора больших данных — сжатые отступы и повышенные требования к контрасту."],["h2","Навигация"],["p","Пользователь перемещается на двух уровнях: между продуктами платформы и между модулями продукта. Ко второму уровню обращаются чаще. Анализ основных действий по продуктам дал перечень сквозного функционала и понимание объёма вложенности. Готовое решение мы проверили исследованием."],["img","sfera_4"],["h2","Информационные модули"],["p","Модули снижают вложенность продуктов: делят её на шаги или позволяют что-то уточнить, не уводя со сценария. Их применение чётко регламентировано: создание объекта, редактирование объекта и просмотр детализации без ухода со страницы."],["h2","Эмоциональная среда"],["p","Важно сохранять ощущение дружелюбной и эмоциональной среды. Это помогает дольше держать const app = document.getElementById("app");
let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target) } }), { threshold: .15 });
  document.querySelectorAll(".rv:not(.in)").forEach(el => io.observe(el));
}
function render(){
  const h = location.hash.slice(1);
  const p = P.find(x => x.slug === h);
  const sections = ["projects","about"];
  if (p) { app.innerHTML = project(p); document.title = `${p.title} — Илья Криканов`; window.scrollTo(0,0) }
  else {
    if (!app.querySelector("#projects")) app.innerHTML = home();
    document.title = "Илья Криканов — Head of Design";
    if (sections.includes(h)) document.getElementById(h).scrollIntoView({ behavior: "smooth" });
    else if (!h) window.scrollTo(0,0);
  }
  observe();
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-scroll]"); if (!a) return;
  e.preventDefault(); const id = a.dataset.scroll;
  if (!app.querySelector("#"+id)) { app.innerHTML = home(); observe() }
  history.replaceState(null, "", "#" + id);
  document.getElementById(id).scrollIntoView({ behavior: "smooth" });
});
window.addEventListener("hashchange", render);
render();
</script>
